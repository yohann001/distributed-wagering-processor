# Balanceia entre as réplicas do serviço `app`. O DNS interno do Docker resolve `app`
# para todas as réplicas; o `resolver` + variável força re-resolução quando réplicas sobem/descem.
events {}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout upstream;

  upstream app_replicas {
    zone app_replicas 64k;
    server app:3000 resolve;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://app_replicas;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Não reenviar POST para outra réplica em caso de erro: o retry é decisão do cliente (idempotência).
      proxy_next_upstream error timeout;
    }
  }
}
